<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi Sprite: coming soon</title>
<meta name="description" content="Mochi Sprite is a pixel drawing app, coming soon to Steam.">
<link rel="icon" type="image/svg+xml" href="https://raw.githubusercontent.com/hitmafia/mochi-sprite/main/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #f0f1f5;
    color: #17181d;
    font-family: 'Jost', system-ui, sans-serif;
    min-height: 100vh;
    padding: 72px 24px 80px;
  }
  main { max-width: 1040px; margin: 0 auto; text-align: center; }
  .tile {
    width: 176px; height: 176px;
    margin: 0 auto 32px;
    border-radius: 40px;
    background: #ff4f9a;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(255, 79, 154, 0.28);
  }
  .tile svg { width: 125px; height: auto; image-rendering: pixelated; }
  h1 { font-size: 56px; font-weight: 500; letter-spacing: -1px; margin: 0 0 12px; line-height: 1.05; }
  .soon { font-size: 20px; color: #6d7180; margin: 0 0 28px; line-height: 1.5; }
  .platforms { font-size: 16px; color: #6d7180; margin: 0 0 20px; letter-spacing: 0.3px; }
  .badge {
    display: inline-block;
    font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    color: #ffffff; background: #17181d;
    border-radius: 999px; padding: 8px 18px;
  }
  figure { margin: 64px 0 0; }
  .window {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #dddee3;
    box-shadow: 0 24px 60px rgba(23, 24, 29, 0.12);
    background: #141519;
  }
  .window img { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 20px; font-size: 18px; color: #6d7180; }
  @media (max-width: 640px) {
    body { padding: 48px 16px 56px; }
    h1 { font-size: 40px; }
    .tile { width: 136px; height: 136px; border-radius: 28px; }
    .tile svg { width: 96px; }
    figure { margin-top: 44px; }
    .window { border-radius: 8px; }
  }
</style>
</head>
<body>
<main>
  <div class="tile">

      <path fill="#ffa2ac" d="M8 17h2v1h-2zM21 17h2v1h-2z"/>
      <path fill="#ffd2b9" d="M8 19h1v1h-1zM22 19h1v1h-1zM7 20h1v1h-1zM23 20h1v1h-1z"/>
    </svg>
  </div>
  <h1>Mochi Sprite</h1>
  <p class="soon">A pixel drawing app, coming soon to Steam.</p>
  <p class="platforms">Available for Windows, Mac, and Linux</p>
  <span class="badge">Coming soon</span>

  <figure>
    <div class="window">
      <picture>
        <source media="(max-width: 640px)" srcset="https://raw.githubusercontent.com/hitmafia/mochi-sprite/main/app-screenshot-mobile.png">
        <img src="https://raw.githubusercontent.com/hitmafia/mochi-sprite/main/app-screenshot.png" alt="Mochi Sprite editor showing an animal sprite sheet, a 10-frame move and dead animation timeline, the shading panel, and the layers and palette panels" width="1926" height="1300">

</main>

</html>
